<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1022">
<title>Команда курʼєрів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1022;--bg2:#171A36;--bg3:#22264A;--line:rgba(255,255,255,.07);--tx:#F2F3FF;--tx2:#A3A7CF;--tx3:#6F74A3;--mint:#3FE0A0;--mint2:#22B67E;--amber:#FFC15E;--red:#FF5470;--blue:#7FB8FF;--fd:'Unbounded',system-ui,sans-serif;--fb:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
h1{font:600 21px/1.2 var(--fd);margin:0}
h2{font:600 15px/1.3 var(--fd);margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font:500 12.5px var(--fb);color:var(--tx2)}
h3{font:600 18px/1.25 var(--fd);margin:2px 0 12px}
p{margin:0 0 8px}
.mut{color:var(--tx2);font-size:13.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.top p{margin:3px 0 0;color:var(--tx2);font-size:13.5px}
.mon{display:flex;align-items:center;gap:2px;background:var(--bg2);border-radius:13px;padding:3px}
.mon button{width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--tx2);text-align:center}
.mon button:disabled{opacity:.25}
.mon span{font-weight:600;font-size:13.5px;min-width:76px;text-align:center}
.hero{border-radius:24px;padding:18px;background:radial-gradient(120% 140% at 100% 0%,rgba(63,224,160,.28),transparent 55%),linear-gradient(160deg,#1E2350,#151836);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.hero small{color:var(--tx2);font-size:13px}
.big{display:block;font:700 34px/1.1 var(--fd);margin:4px 0 2px;letter-spacing:-.02em}
.bar{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint2),var(--mint))}
.bar.sm{height:5px;margin:8px 0 0}
.tier{font-size:13.5px;color:var(--tx2)}
.tier b{color:var(--mint)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cell{background:var(--bg2);border-radius:16px;padding:12px 13px}
.cell small{display:block;color:var(--tx2);font-size:12.5px}
.cell b{display:block;font:600 17px/1.3 var(--fd);margin-top:3px}
.cell.warn b{color:var(--amber)}
.cell.ok b{color:var(--mint)}
.card{background:var(--bg2);border-radius:20px;padding:15px 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--tx2)}
.form .w{grid-column:1/-1}
.in{width:100%;padding:11px 13px;border-radius:12px;background:var(--bg3);border:1.5px solid transparent;outline:none;font-size:16px;color:var(--tx)}
.in:focus{border-color:rgba(63,224,160,.6)}
.in::placeholder{color:var(--tx3)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px;border-radius:14px;font-weight:600;background:var(--mint);color:#062618;text-align:center;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--bg3);color:var(--tx)}
.btn.red{background:rgba(255,84,112,.16);color:#FF9DAD}
.btn.sm{width:auto;padding:9px 13px;border-radius:11px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{padding:11px 0;border-radius:12px;background:var(--bg3);font-weight:600;font-size:13.5px;text-align:center;color:var(--tx2)}
.days button.on{background:rgba(63,224,160,.2);color:var(--mint);box-shadow:inset 0 0 0 1.5px rgba(63,224,160,.6)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px}
.wd small{font-size:10.5px;color:var(--tx2);min-height:13px}
.wd i{display:block;width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:rgba(63,224,160,.3)}
.wd i.t{background:linear-gradient(180deg,var(--mint),var(--mint2))}
.wd span{font-size:11px;color:var(--tx3)}
.wd.plan span{color:var(--tx)}
.list{background:var(--bg2);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:600;font-size:14.5px}
.li .m small{color:var(--tx2);font-size:12.5px}
.li .v{font:600 14px var(--fd);text-align:right;flex:none}
.li .v small{display:block;font:500 11.5px var(--fb);color:var(--tx2)}
.li.off{opacity:.45}
.empty{color:var(--tx2);font-size:14px;padding:14px;text-align:center}
.badge{display:inline-block;font:600 11px var(--fd);padding:3px 7px;border-radius:99px;background:rgba(255,193,94,.15);color:var(--amber);margin-left:6px;vertical-align:2px}
.badge.hi{background:rgba(63,224,160,.16);color:var(--mint)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:9px 0;border-radius:11px;font-weight:600;font-size:14px;color:var(--tx2);text-align:center}
.seg button.on{background:var(--bg3);color:var(--tx)}
.grid7{display:flex;flex-direction:column;gap:8px}
.gday{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border-radius:16px;padding:12px 14px}
.gday.today{box-shadow:inset 0 0 0 1.5px rgba(63,224,160,.55)}
.gday>b{font:600 14px var(--fd);width:30px;flex:none;padding-top:2px}
.gday .ppl{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.gday .ppl span{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--bg3)}
.gday .ppl em{font-style:normal;color:var(--tx3);font-size:13px;padding-top:3px}
.gday .h{font:600 12.5px var(--fd);color:var(--tx2);flex:none;padding-top:3px}
.lnk{display:block;width:100%;text-align:center;padding:12px;color:var(--tx2);font-size:14px}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.center .e{font-size:46px}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid rgba(63,224,160,.2);border-top-color:var(--mint);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet-bg{position:fixed;inset:0;background:rgba(4,5,15,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:88vh;overflow:auto;transform:translate(-50%,105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;background:var(--bg2);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));z-index:41}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grip{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet .list,.sheet .cell{background:var(--bg3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s;background:#2A2F5E;padding:11px 16px;border-radius:14px;font-size:14px;z-index:60;box-shadow:0 10px 26px rgba(0,0,0,.45);max-width:calc(100% - 28px)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
.toast.err{background:#5A1C2C}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"><div class="center"><div class="spin"></div></div></main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Адреса сервера (Google Apps Script). Підставляється після розгортання.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDPWxwacgbhAgihNXb_EAJ3njk-i1oM2oToaHjY_Ci9MXFQRx0-cIi-DYLS10_e5hp/exec';
// Розподіл ставки між тобою і засновником: ставка → твоя частка, %
const SHARE = {30: 10, 25: 12.5};
const PARTNER = 'Гоша';
const API = (location.hostname === 'localhost' && new URLSearchParams(location.search).get('api')) || SCRIPT_URL;

const tg = window.Telegram && window.Telegram.WebApp;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const kdate = k => new Date(k + 'T12:00:00');
const addD = (k, n) => { const d = kdate(k); d.setDate(d.getDate() + n); return dkey(d); };
const fmt = n => Math.round(+n || 0).toLocaleString('uk-UA');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pl = (n, a, b, c) => { n = Math.abs(Math.round(n)); const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? a : t >= 2 && t <= 4 && (h < 10 || h >= 20) ? b : c; };
const MON_N = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
const MON = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
const WDS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
const monL = m => MON_N[+m.slice(5) - 1].toLowerCase();
const fday = k => { const d = kdate(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const wdOf = k => (kdate(k).getDay() + 6) % 7 + 1; // 1 = Пн
const num = v => { const n = parseFloat(String(v || '').replace(',', '.')); return isFinite(n) ? n : 0; };
const hap = t => { try { if (tg && tg.HapticFeedback) t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

let D = null, month = '', view = 'team', busy = false, regDays = [], entryDate = '';
const ERR = {auth: 'Не вдалося підтвердити вхід через Telegram', inactive: 'Тебе прибрано з команди', bad_date: 'Цю дату вже не можна змінити', not_registered: 'Спочатку зареєструйся', bad_payment: 'Перевір суму'};

async function api(action, data = {}) {
  const r = await fetch(API, {method: 'POST', body: JSON.stringify(Object.assign({initData: tg.initData, action}, data))});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}
async function run(action, data, okMsg, btn) {
  if (busy) return;
  busy = true;
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Зберігаю…'; }
  try {
    D = await api(action, data);
    closeSheet(); render(); hap('ok');
    if (okMsg) toast(okMsg);
  } catch (e) {
    toast(ERR[e.message] || 'Не вдалося зберегти. Перевір інтернет і спробуй ще раз', true);
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; }
  } finally { busy = false; }
}
let toastT;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, 2800); }
function openSheet(h) { const s = $('#sheet'); s.innerHTML = '<div class="grip"></div>' + h; s.scrollTop = 0; s.classList.add('open'); $('#sheetBg').classList.add('open'); if (tg && tg.BackButton) tg.BackButton.show(); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheetBg').classList.remove('open'); if (tg && tg.BackButton) tg.BackButton.hide(); }

/* ---------- розрахунки ---------- */
const cfg = () => D.config;
function stat(id, m) {
  const es = D.entries.filter(e => e.id === id && e.date.slice(0, 7) === m);
  const gross = es.reduce((s, e) => s + e.earned, 0), hours = es.reduce((s, e) => s + e.hours, 0);
  const rate = gross >= cfg().threshold ? cfg().rateHigh : cfg().rate, cut = Math.round(gross * rate / 100);
  const myPct = SHARE[rate] != null ? SHARE[rate] : rate / 2, mine = Math.round(gross * myPct / 100), partner = cut - mine;
  const paid = D.payments.filter(p => p.id === id && p.date.slice(0, 7) === m).reduce((s, p) => s + p.amount, 0);
  const last = D.entries.filter(e => e.id === id).map(e => e.date).sort().pop() || '';
  return {es, myPct, mine, partner, gross, hours, shifts: es.filter(e => e.earned > 0 || e.hours > 0).length, rate, cut, keep: gross - cut, paid, owed: Math.max(0, cut - paid), last};
}
function weekDays() { const t = D.today, mon = addD(t, -(wdOf(t) - 1)); return Array.from({length: 7}, (_, i) => addD(mon, i)); }
const monthName = m => `${MON_N[+m.slice(5) - 1]} ${m.slice(0, 4)}`;
function months() { const out = []; let d = kdate(D.today.slice(0, 7) + '-01'); for (let i = 0; i < 4; i++) { out.unshift(dkey(d).slice(0, 7)); d.setMonth(d.getMonth() - 1); } return out; }
function monBar() { const ms = months(), i = ms.indexOf(month); return `<div class="mon"><button data-a="mon" data-d="-1" ${i <= 0 ? 'disabled' : ''} aria-label="Попередній місяць">‹</button><span>${MON_N[+month.slice(5) - 1]}</span><button data-a="mon" data-d="1" ${i >= ms.length - 1 ? 'disabled' : ''} aria-label="Наступний місяць">›</button></div>`; }
function tierHTML(s) {
  const c = cfg();
  if (s.gross >= c.threshold) return `<span class="bar"><i style="width:100%"></i></span><div class="tier">Ставка <b>${c.rateHigh}%</b> замість ${c.rate}%: ти заробив від ${fmt(c.threshold)} грн 🔥</div>`;
  return `<span class="bar"><i style="width:${Math.min(100, s.gross / c.threshold * 100).toFixed(1)}%"></i></span><div class="tier">До ставки <b>${c.rateHigh}%</b> лишилось ${fmt(c.threshold - s.gross)} грн</div>`;
}

/* ---------- екрани ---------- */
function render() {
  if (!D) return;
  if (!month) month = D.today.slice(0, 7);
  const app = $('#app');
  if (D.owner && view !== 'me') app.innerHTML = ownerHTML();
  else if (!D.courier) app.innerHTML = registerHTML();
  else if (!D.courier.active) app.innerHTML = `<div class="center"><span class="e">🚲</span><h3>Тебе прибрано з команди</h3><p class="mut">Якщо це помилка, напиши власнику.</p></div>`;
  else app.innerHTML = courierHTML();
}

function registerHTML() {
  return `<div class="top"><div><h1>Вітаю в команді 👋</h1><p>Заповни один раз, далі тільки вписуй зміни</p></div></div>
  <form class="card form" data-f="register">
    <label class="w">Імʼя<input class="in" name="name" value="${esc(D.me.name)}" maxlength="40" required></label>
    <label class="w">Робочі дні<div class="days">${WDS.map((w, i) => `<button type="button" data-a="regDay" data-d="${i + 1}" class="${regDays.includes(i + 1) ? 'on' : ''}" aria-pressed="${regDays.includes(i + 1)}">${w}</button>`).join('')}</div></label>
    <label class="w">Годин за зміну<input class="in" name="hours" type="number" inputmode="decimal" min="1" max="16" value="4"></label>
    <button class="btn w" type="submit">Почати</button>
  </form>`;
}

function courierHTML() {
  const c = D.courier, s = stat(c.id, month), isCur = month === D.today.slice(0, 7), cf = cfg();
  let h = `<div class="top"><div><h1>Привіт, ${esc(c.name)}</h1><p>${c.days.length ? `Графік: ${c.days.map(d => WDS[d - 1]).join(', ')}, по ${c.hours} год` : 'Графік не вказано'}</p></div>${monBar()}</div>`;
  if (D.owner) h += `<button class="lnk" data-a="view" data-v="team">← До команди</button>`;
  h += `<div class="hero"><small>Заробив за ${monL(month)}</small><b class="big">${fmt(s.gross)} грн</b><small>${s.shifts} ${pl(s.shifts, 'зміна', 'зміни', 'змін')}, ${fmt(s.hours)} год${s.hours ? `, ${fmt(s.gross / s.hours)} грн/год` : ''}</small>${tierHTML(s)}</div>
  <div class="split"><div class="cell"><small>Віддаєш ${s.rate}%</small><b>${fmt(s.cut)} грн</b></div><div class="cell ok"><small>Тобі лишається</small><b>${fmt(s.keep)} грн</b></div>
  <div class="cell"><small>Вже віддав</small><b>${fmt(s.paid)} грн</b></div><div class="cell ${s.owed ? 'warn' : 'ok'}"><small>Ще віддати</small><b>${fmt(s.owed)} грн</b></div></div>`;
  if (isCur) {
    const d = entryDate || D.today, ex = D.entries.find(e => e.id === c.id && e.date === d);
    h += `<h2>${d === D.today ? 'Сьогоднішня зміна' : `Зміна ${fday(d)}`} <small>${ex ? 'записано, можна змінити' : 'впиши після зміни'}</small></h2>
    <form class="card form" data-f="entry">
      <label class="w">Дата<input class="in" name="date" type="date" value="${d}" max="${D.today}" min="${addD(D.today, -62)}" data-a="pickDate"></label>
      <label>Годин<input class="in" name="hours" type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${ex ? ex.hours : ''}" placeholder="${c.hours || 4}"></label>
      <label>Заробив, грн<input class="in" name="earned" type="number" inputmode="decimal" min="0" value="${ex ? ex.earned : ''}" placeholder="800"></label>
      <label class="w">Замовлень (необовʼязково)<input class="in" name="orders" type="number" inputmode="numeric" min="0" value="${ex && ex.orders ? ex.orders : ''}"></label>
      <button class="btn w" type="submit">${ex ? 'Оновити' : 'Зберегти'}</button>
      ${ex ? `<button class="btn red w" type="button" data-a="delEntry" data-d="${d}">Видалити запис</button>` : ''}
    </form>`;
    const wk = weekDays(), vals = wk.map(k => (D.entries.find(e => e.id === c.id && e.date === k) || {}).earned || 0), mx = Math.max(1, ...vals);
    h += `<h2>Цей тиждень <small>${fmt(vals.reduce((a, b) => a + b, 0))} грн</small></h2><div class="card"><div class="week">${wk.map((k, i) => `<div class="wd${c.days.includes(i + 1) ? ' plan' : ''}"><small>${vals[i] ? fmt(vals[i]) : ''}</small><i class="${k === D.today ? 't' : ''}" style="height:${Math.max(3, Math.round(vals[i] / mx * 70))}px"></i><span>${WDS[i]}</span></div>`).join('')}</div></div>`;
  }
  const list = s.es.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  h += `<h2>Зміни за ${monL(month)} <small>${list.length}</small></h2><div class="list">${list.length ? list.map(e => `<button class="li" data-a="edit" data-d="${e.date}"><span class="m"><b>${fday(e.date)}, ${WDS[wdOf(e.date) - 1]}</b><small>${e.hours} год${e.orders ? `, ${e.orders} замовл.` : ''}</small></span><span class="v">${fmt(e.earned)} грн</span></button>`).join('') : '<div class="empty">Поки немає записів</div>'}</div>`;
  h += `<h2>Мій графік</h2><form class="card form" data-f="schedule">
    <label class="w">Робочі дні<div class="days">${WDS.map((w, i) => `<button type="button" data-a="schDay" data-d="${i + 1}" class="${c.days.includes(i + 1) ? 'on' : ''}" aria-pressed="${c.days.includes(i + 1)}">${w}</button>`).join('')}</div></label>
    <label>Годин за зміну<input class="in" name="hours" type="number" inputmode="decimal" min="1" max="16" value="${c.hours}"></label>
    <label>Імʼя<input class="in" name="name" value="${esc(c.name)}" maxlength="40"></label>
    <button class="btn ghost w" type="submit">Зберегти графік</button></form>
    <p class="mut" style="margin-top:14px">Ставка: ${cf.rate}% від заробленого. Якщо за місяць заробиш від ${fmt(cf.threshold)} грн, віддаєш лише ${cf.rateHigh}% за весь місяць.</p>`;
  return h;
}

function ownerHTML() {
  const team = D.couriers.map(c => ({c, s: stat(c.id, month)})).sort((a, b) => (b.c.active - a.c.active) || (b.s.gross - a.s.gross));
  const tot = team.reduce((t, x) => { t.gross += x.s.gross; t.cut += x.s.cut; t.mine += x.s.mine; t.partner += x.s.partner; t.paid += x.s.paid; t.owed += x.s.owed; return t; }, {gross: 0, cut: 0, mine: 0, partner: 0, paid: 0, owed: 0});
  const active = D.couriers.filter(c => c.active).length;
  let h = `<div class="top"><div><h1>Команда</h1><p>${active} ${pl(active, 'активний курʼєр', 'активні курʼєри', 'активних курʼєрів')}</p></div>${monBar()}</div>
  <div class="seg">${[['team', 'Курʼєри'], ['plan', 'Графік'], ['money', 'Оплати']].map(([v, n]) => `<button class="${view === v ? 'on' : ''}" data-a="view" data-v="${v}">${n}</button>`).join('')}</div>`;
  if (view === 'team') {
    h += `<div class="hero"><small>Команда заробила за ${monL(month)}</small><b class="big">${fmt(tot.gross)} грн</b><small>Віддають ${fmt(tot.cut)} грн</small></div>
    <div class="split"><div class="cell ok"><small>Твоя частка</small><b>${fmt(tot.mine)} грн</b></div><div class="cell"><small>${PARTNER}</small><b>${fmt(tot.partner)} грн</b></div></div>
    <div class="split"><div class="cell ok"><small>Отримав</small><b>${fmt(tot.paid)} грн</b></div><div class="cell ${tot.owed ? 'warn' : 'ok'}"><small>Ще мають віддати</small><b>${fmt(tot.owed)} грн</b></div></div>
    <h2>Курʼєри <small>за ${monL(month)}</small></h2><div class="list">${team.length ? team.map(({c, s}) => `<button class="li${c.active ? '' : ' off'}" data-a="courier" data-id="${c.id}"><span class="m"><b>${esc(c.name)}<span class="badge${s.rate === cfg().rateHigh ? ' hi' : ''}">${s.rate}%</span></b><small>${s.shifts} ${pl(s.shifts, 'зміна', 'зміни', 'змін')}${s.last ? `, остання ${fday(s.last)}` : ''}${c.active ? '' : ', не в команді'}</small><span class="bar sm"><i style="width:${Math.min(100, s.gross / cfg().threshold * 100).toFixed(1)}%"></i></span></span><span class="v">${fmt(s.gross)} грн<small>${s.owed ? `винен ${fmt(s.owed)}` : s.cut ? 'усе віддав' : ''}</small></span></button>`).join('') : '<div class="empty">Поки нікого. Скинь курʼєрам посилання на бота.</div>'}</div>`;
  } else if (view === 'plan') {
    const wk = weekDays();
    h += `<p class="mut">Хто за графіком працює цього тижня. Зелена рамка — сьогодні.</p><div class="grid7">${wk.map((k, i) => {
      const ppl = D.couriers.filter(c => c.active && c.days.includes(i + 1)), hrs = ppl.reduce((s, c) => s + c.hours, 0);
      const worked = D.entries.filter(e => e.date === k && e.earned > 0).map(e => e.id);
      return `<div class="gday${k === D.today ? ' today' : ''}"><b>${WDS[i]}</b><div class="ppl">${ppl.length ? ppl.map(c => `<span>${worked.includes(c.id) ? '✅ ' : ''}${esc(c.name)}</span>`).join('') : '<em>нікого</em>'}</div><span class="h">${hrs ? `${fmt(hrs)} год` : ''}</span></div>`;
    }).join('')}</div>`;
  } else {
    const pays = D.payments.filter(p => p.date.slice(0, 7) === month).sort((a, b) => a.date < b.date ? 1 : -1);
    const name = id => (D.couriers.find(c => c.id === id) || {}).name || 'Курʼєр';
    h += `<div class="split" style="margin-top:0"><div class="cell ok"><small>Твоя частка</small><b>${fmt(tot.mine)} грн</b></div><div class="cell"><small>${PARTNER}</small><b>${fmt(tot.partner)} грн</b></div><div class="cell"><small>Мають віддати всього</small><b>${fmt(tot.cut)} грн</b></div><div class="cell ok"><small>Отримано</small><b>${fmt(tot.paid)} грн</b></div></div>
    <h2>Оплати за ${monL(month)} <small>${pays.length}</small></h2><div class="list">${pays.length ? pays.map(p => `<button class="li" data-a="payMenu" data-pid="${p.pid}"><span class="m"><b>${esc(name(p.id))}</b><small>${fday(p.date)}${p.note ? `, ${esc(p.note)}` : ''}</small></span><span class="v">${fmt(p.amount)} грн</span></button>`).join('') : '<div class="empty">Оплат ще немає. Додай оплату в картці курʼєра.</div>'}</div>`;
  }
  if (D.courier) h += `<button class="lnk" data-a="view" data-v="me">Мій кабінет курʼєра</button>`;
  if (D.sheetUrl) h += `<button class="lnk" data-a="sheet">Відкрити Google Таблицю</button>`;
  return h;
}

function courierSheet(id) {
  const c = D.couriers.find(x => x.id === id); if (!c) return;
  const s = stat(id, month), list = s.es.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const pays = D.payments.filter(p => p.id === id && p.date.slice(0, 7) === month);
  openSheet(`<h3>${esc(c.name)}${c.username ? ` <span class="mut">@${esc(c.username)}</span>` : ''}</h3>
    <p class="mut">${c.days.length ? `Графік: ${c.days.map(d => WDS[d - 1]).join(', ')}, по ${c.hours} год` : 'Графік не вказано'}. З нами з ${fday(c.joined)}.</p>
    <div class="split"><div class="cell"><small>Заробив за ${monL(month)}</small><b>${fmt(s.gross)} грн</b></div><div class="cell"><small>Ставка</small><b>${s.rate}%</b></div>
    <div class="cell ok"><small>Твоя частка ${String(s.myPct).replace('.', ',')}%</small><b>${fmt(s.mine)} грн</b></div><div class="cell"><small>${PARTNER} ${String(s.rate - s.myPct).replace('.', ',')}%</small><b>${fmt(s.partner)} грн</b></div>
    <div class="cell"><small>Вже віддав</small><b>${fmt(s.paid)} грн</b></div><div class="cell ${s.owed ? 'warn' : 'ok'}"><small>Ще винен</small><b>${fmt(s.owed)} грн</b></div></div>
    <h2>Додати оплату</h2><form class="form" data-f="pay" data-id="${id}"><label>Сума, грн<input class="in" name="amount" type="number" inputmode="decimal" min="1" value="${s.owed || ''}"></label><label>Дата<input class="in" name="date" type="date" value="${D.today}" max="${D.today}"></label><label class="w">Примітка<input class="in" name="note" maxlength="80" placeholder="Напр. готівкою"></label><button class="btn w" type="submit">Записати оплату</button></form>
    ${pays.length ? `<h2>Оплати</h2><div class="list">${pays.map(p => `<div class="li"><span class="m"><b>${fday(p.date)}</b><small>${esc(p.note)}</small></span><span class="v">${fmt(p.amount)} грн</span></div>`).join('')}</div>` : ''}
    <h2>Зміни <small>${list.length}</small></h2><div class="list">${list.length ? list.map(e => `<div class="li"><span class="m"><b>${fday(e.date)}, ${WDS[wdOf(e.date) - 1]}</b><small>${e.hours} год${e.orders ? `, ${e.orders} замовл.` : ''}</small></span><span class="v">${fmt(e.earned)} грн</span></div>`).join('') : '<div class="empty">Записів немає</div>'}</div>
    <div class="row2"><button class="btn ghost" data-a="close">Закрити</button><button class="btn ${c.active ? 'red' : ''}" data-a="active" data-id="${id}" data-on="${c.active ? 0 : 1}">${c.active ? 'Прибрати з команди' : 'Повернути в команду'}</button></div>`);
}

/* ---------- дії ---------- */
const A = {
  mon: d => { const ms = months(), i = ms.indexOf(month) + +d.d; if (ms[i]) { month = ms[i]; entryDate = ''; render(); } },
  view: d => { view = d.v; render(); scrollTo(0, 0); },
  regDay: (d, b) => { const n = +d.d; regDays = regDays.includes(n) ? regDays.filter(x => x !== n) : [...regDays, n]; b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); },
  schDay: (d, b) => { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); },
  edit: d => { if (month !== D.today.slice(0, 7)) return; entryDate = d.d; render(); const f = $('[data-f=entry]'); if (f) f.scrollIntoView({behavior: 'smooth', block: 'center'}); },
  delEntry: (d, b) => { if (confirmDel !== d.d) { confirmDel = d.d; b.textContent = 'Точно видалити?'; return; } confirmDel = ''; run('delEntry', {date: d.d}, 'Запис видалено', b).then(() => { entryDate = ''; render(); }); },
  courier: d => courierSheet(d.id),
  active: (d, b) => run('active', {for: d.id, active: d.on === '1'}, d.on === '1' ? 'Повернуто в команду' : 'Прибрано з команди', b),
  payMenu: d => { const p = D.payments.find(x => x.pid === d.pid); if (!p) return; openSheet(`<h3>Оплата ${fmt(p.amount)} грн</h3><p class="mut">${fday(p.date)}${p.note ? `, ${esc(p.note)}` : ''}</p><div class="row2"><button class="btn ghost" data-a="close">Закрити</button><button class="btn red" data-a="delPay" data-pid="${p.pid}">Видалити</button></div>`); },
  delPay: (d, b) => run('delPay', {pid: d.pid}, 'Оплату видалено', b),
  sheet: () => { try { tg.openLink(D.sheetUrl); } catch (e) { window.open(D.sheetUrl, '_blank'); } },
  close: () => closeSheet(),
};
let confirmDel = '';
const F = {
  register: f => { if (!regDays.length) return toast('Обери хоча б один робочий день', true); run('register', {name: f.elements.name.value, days: regDays, hours: f.elements.hours.value}, 'Ти в команді!', f.querySelector('[type=submit]')); },
  schedule: f => { const ds = [...f.querySelectorAll('.days .on')].map(b => +b.dataset.d); run('schedule', {name: f.elements.name.value, days: ds, hours: f.elements.hours.value}, 'Графік збережено', f.querySelector('[type=submit]')); },
  entry: f => {
    const e = f.elements, earned = num(e.earned.value), hours = num(e.hours.value || e.hours.placeholder);
    if (!e.date.value) return toast('Обери дату', true);
    if (!(earned > 0)) return toast('Впиши, скільки заробив', true);
    run('entry', {date: e.date.value, hours, earned, orders: num(e.orders.value)}, `Записано: ${fmt(earned)} грн`, f.querySelector('[type=submit]')).then(() => { entryDate = ''; render(); });
  },
  pay: f => { const a = num(f.elements.amount.value); if (!(a > 0)) return toast('Впиши суму', true); run('pay', {for: f.dataset.id, amount: a, date: f.elements.date.value, note: f.elements.note.value}, `Оплату ${fmt(a)} грн записано`, f.querySelector('[type=submit]')); },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return; const fn = A[b.dataset.a]; if (!fn) return; e.preventDefault(); fn(b.dataset, b); });
document.addEventListener('submit', e => { const fn = F[e.target.dataset.f]; if (!fn) return; e.preventDefault(); fn(e.target); });
document.addEventListener('change', e => { if (e.target.name === 'date' && e.target.closest('[data-f=entry]')) { entryDate = e.target.value || ''; render(); } });
$('#sheetBg').addEventListener('click', closeSheet);

async function boot() {
  if (!tg || !tg.initData) { $('#app').innerHTML = `<div class="center"><span class="e">🚲</span><h3>Відкрий через бота в Telegram</h3><p class="mut">Застосунок працює тільки всередині Telegram.</p></div>`; return; }
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#0E1022'); tg.setBackgroundColor('#0E1022'); if (tg.BackButton) tg.BackButton.onClick(closeSheet); } catch (e) {}
  if (!/^https:\/\/script\.google\.com\//.test(API) && location.hostname !== 'localhost') { $('#app').innerHTML = `<div class="center"><span class="e">🛠️</span><h3>Сервер ще не підключено</h3><p class="mut">Застосунок запрацює, щойно власник підключить таблицю.</p></div>`; return; }
  try { D = await api('me'); view = D.owner ? 'team' : 'me'; render(); }
  catch (e) { $('#app').innerHTML = `<div class="center"><span class="e">📡</span><h3>${esc(ERR[e.message] || 'Не вдалося завантажити')}</h3><p class="mut">Перевір інтернет.</p><button class="btn sm" onclick="location.reload()">Спробувати ще раз</button></div>`; }
}
boot();
</script>
</body>
</html>
