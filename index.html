<!DOCTYPE html>
<html lang="uk" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100C29">
<title>Мої цілі</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#100C29;--bg2:#1A1540;--bg3:#262058;--line:rgba(255,255,255,.07);--tx:#F4F1FF;--tx2:#ABA4D4;--tx3:#7A73A8;--amber:#FFC15E;--coral:#FF7F6E;--mint:#3FE0A0;--red:#FF5470;--ice:#8AD8FF;--crane:#FFB547;--fd:'Unbounded',system-ui,sans-serif;--fb:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
[data-theme=dusk]{--s1:#0A0A28;--s2:#1D1652;--s3:#55286F;--s4:#C9566A;--s5:#F59A5E;--sun-a:#FFE3A3;--sun-b:#FFB067;--far:#2A1F5C;--near:#150F33;--win:#FFD27A;--tw:#33276C;--tw-hi:#7462D0;--lit:#FFC766;--w1:#1C1440;--w2:#0B0820;--st:.8}
[data-theme=night]{--s1:#02030C;--s2:#060A22;--s3:#0C1440;--s4:#151D55;--s5:#1F2868;--sun-a:#EEF2FF;--sun-b:rgba(170,190,255,.35);--far:#111940;--near:#090E2A;--win:#FFE29A;--tw:#1E2760;--tw-hi:#5363B8;--lit:#FFD57A;--w1:#0A0F2B;--w2:#02030C;--st:1}
[data-theme=dawn]{--s1:#1B2A5A;--s2:#3A4C8C;--s3:#8878B6;--s4:#F0A49E;--s5:#FFD6A6;--sun-a:#FFF6DC;--sun-b:#FFC7A0;--far:#4A4E86;--near:#2A2C5C;--win:#FFF0C8;--tw:#3B4080;--tw-hi:#8C92D6;--lit:#FFE3A6;--w1:#2A2C5C;--w2:#16183A;--st:.25}
[data-theme=aurora]{--s1:#020814;--s2:#05152B;--s3:#0A2740;--s4:#0F334C;--s5:#163E56;--sun-a:#E8FFF6;--sun-b:rgba(120,255,210,.3);--far:#0A2133;--near:#051422;--win:#B8FFE6;--tw:#123049;--tw-hi:#3C86A6;--lit:#FFD27A;--w1:#051422;--w2:#020814;--st:1}
[data-theme=gold]{--s1:#2A1A3A;--s2:#5A2E4A;--s3:#B4554A;--s4:#EE883E;--s5:#FFC857;--sun-a:#FFF3B8;--sun-b:#FFB13D;--far:#5A2E3E;--near:#2E1626;--win:#FFE9A8;--tw:#4A2638;--tw-hi:#C07A58;--lit:#FFE08A;--w1:#2E1626;--w2:#170A12;--st:.2}
[data-theme=neon]{--s1:#0B0221;--s2:#1E0645;--s3:#4A0B6E;--s4:#8E1A8C;--s5:#FF3D8B;--sun-a:#FFE36E;--sun-b:#FF3D8B;--far:#2A0A52;--near:#14052E;--win:#FF6BDF;--tw:#2A0E55;--tw-hi:#B23DFF;--lit:#4DF3FF;--w1:#14052E;--w2:#07010F;--st:.7}
[data-theme=royal]{--s1:#07030F;--s2:#170A30;--s3:#2B1153;--s4:#481B78;--s5:#68298C;--sun-a:#FFE7A6;--sun-b:rgba(255,205,110,.4);--far:#1C0E36;--near:#0E0620;--win:#F0CB6E;--tw:#24113F;--tw-hi:#D1A74E;--lit:#FFD36B;--w1:#0E0620;--w2:#050210;--st:1}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:10px 14px calc(104px + env(safe-area-inset-bottom))}

/* --- типографіка --- */
.top{padding:4px 4px 12px}
.top h1{font:600 20px/1.2 var(--fd);margin:0;letter-spacing:-.01em}
.top p{margin:3px 0 0;color:var(--tx2);font-size:13.5px}
.pg{font:600 24px/1.2 var(--fd);margin:10px 2px 16px;letter-spacing:-.01em}
h2{font:600 15.5px/1.3 var(--fd);margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font:500 12.5px/1.3 var(--fb);color:var(--tx2);text-align:right}
h3{font:600 19px/1.25 var(--fd);margin:4px 0 10px}
h4{font:600 14px var(--fd);margin:20px 0 8px}
p{margin:0 0 8px}
.mut{color:var(--tx2);font-size:13.5px}
.neg{color:var(--red)}.pos{color:var(--mint)}
.empty{color:var(--tx2);font-size:14px;margin:2px 2px 10px}
.hint{color:var(--tx3);font-size:12.5px;margin:12px 2px 10px}
.big{font:700 24px/1.15 var(--fd);display:block}

/* --- сцена: місто і вежа --- */
.scene{position:relative;height:262px;border-radius:26px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 30%,var(--s3) 52%,var(--s4) 68%,var(--s5) 83%);box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
.scene>*{position:absolute}
.aurora{inset:4% -10% 50%;opacity:0;pointer-events:none}
[data-theme=aurora] .aurora{opacity:1;background:radial-gradient(55% 45% at 28% 62%,rgba(61,255,176,.55),transparent 70%),radial-gradient(45% 40% at 72% 38%,rgba(41,199,255,.45),transparent 70%),radial-gradient(30% 30% at 52% 70%,rgba(160,110,255,.3),transparent 70%);filter:blur(10px);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{0%{transform:translateX(-4%) skewX(-8deg)}100%{transform:translateX(4%) skewX(8deg)}}
.stars{inset:0 0 42% 0;opacity:var(--st)}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
.sun{left:30%;bottom:38px;width:136px;height:136px;margin-left:-68px;border-radius:50%;background:radial-gradient(circle,var(--sun-a) 0%,var(--sun-b) 34%,transparent 68%)}
[data-theme=night] .sun,[data-theme=aurora] .sun,[data-theme=royal] .sun{left:22%;bottom:auto;top:58px;width:38px;height:38px;margin-left:-19px;background:radial-gradient(circle at 42% 40%,var(--sun-a) 0 64%,transparent 68%);box-shadow:0 0 34px 10px var(--sun-b)}
[data-theme=neon] .sun{width:112px;height:112px;margin-left:-56px;bottom:34px;background:linear-gradient(180deg,var(--sun-a),var(--sun-b) 78%);-webkit-mask:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 11px);mask:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 11px)}
.city{left:0;right:0;bottom:44px}
.city svg,.rc svg,.dcity svg{display:block;width:100%;height:100%}
.far{height:112px}.near{height:70px}
.far .b{fill:var(--far)}.near .b,.rc .b,.dcity .b{fill:var(--near)}
.w{fill:var(--win)}
.w.fl{animation:fl 9s steps(1) infinite}
@keyframes fl{0%,100%{opacity:.9}40%{opacity:.1}70%{opacity:.6}}
.tower{bottom:44px;z-index:3}
.tower svg,.rt svg{display:block;overflow:visible}
.tw-b{fill:var(--tw)}.tw-h{fill:var(--tw-hi)}.tw-l{fill:var(--lit)}.tw-d{fill:#0D0920;opacity:.8}.tw-m{fill:#5C1832}.tw-r{fill:var(--ice)}
.ghost{fill:rgba(255,255,255,.03);stroke:var(--lit);stroke-opacity:.28;stroke-width:.8;stroke-dasharray:3 2.5}
.ghl{stroke:var(--lit);stroke-opacity:.07;stroke-width:.6;fill:none}
.scaf rect,.scaf path{fill:none;stroke:var(--lit);stroke-width:1;stroke-dasharray:2.4 1.8;opacity:.85}
.cr{stroke:var(--crane);stroke-width:1.2;fill:none;stroke-linecap:round}
.crf{fill:var(--crane)}
.trol{animation:trol 10s ease-in-out infinite}
@keyframes trol{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
.beacon{fill:#FF3B4E;animation:blink 1.8s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
.fnew{animation:fnew 1.5s linear}
@keyframes fnew{0%{opacity:0}18%{opacity:1}28%{opacity:.25}42%{opacity:1}52%{opacity:.5}66%,100%{opacity:1}}
.water{left:0;right:0;bottom:0;height:44px;overflow:hidden;background:linear-gradient(180deg,var(--w1),var(--w2));box-shadow:inset 0 1px 0 rgba(255,214,160,.28);z-index:2}
.rc{position:absolute;left:0;right:0;top:0;height:70px;transform:scaleY(-1);opacity:.28}
.rt{position:absolute;top:0;transform:scaleY(-1);opacity:.34}
.water::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--w2) 92%);z-index:1}
.water::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 3px,var(--w2) 3px 5px);opacity:.5;animation:wv 3.5s linear infinite;z-index:1}
@keyframes wv{to{background-position:0 5px}}
.hud{top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5}
.glass{background:rgba(8,6,26,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.rank{display:flex;align-items:center;gap:9px;padding:6px 12px 7px 6px;border-radius:16px}
.rank .re{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.08)}
.rank b{display:block;font:600 12.5px/1.2 var(--fd)}
.rank small{display:block;font-size:11.5px;color:rgba(244,241,255,.75);margin-top:1px}
.xp{width:96px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);margin-top:4px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--amber));border-radius:inherit}
.coin{font:600 15px var(--fd);padding:8px 12px;border-radius:14px;white-space:nowrap}
.coin.neg{color:#FF9DAD;background:rgba(80,10,30,.6)}
.hudb{left:10px;right:10px;bottom:9px;display:flex;gap:6px;z-index:5;align-items:center}
.hudb span{font-size:12px;font-weight:500;padding:4px 9px;border-radius:99px;background:rgba(8,6,26,.55);white-space:nowrap}
.hudb .sp{flex:1}
.scene.hit{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-.6deg)}40%{transform:translateX(5px) rotate(.5deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* --- день --- */
.day{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--bg2)}
.day .di{font-size:19px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07)}
.day b{display:block;font-weight:600}
.day small{display:block;color:var(--tx2);font-size:13px;line-height:1.35}
.day.ok{background:linear-gradient(100deg,rgba(63,224,160,.17),rgba(63,224,160,.04))}
.day.warn{background:linear-gradient(100deg,rgba(255,193,94,.17),rgba(255,193,94,.04))}
.day.rest{background:linear-gradient(100deg,rgba(138,216,255,.17),rgba(138,216,255,.04))}

/* --- цілі --- */
.goal{display:flex;align-items:stretch;background:var(--bg2);border-radius:15px;margin-bottom:7px;overflow:hidden}
.gm{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0;text-align:left}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--tx3);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.done .ck{background:var(--mint);border-color:var(--mint)}
.done .ck::after{content:'';width:10px;height:5px;border:2.5px solid #0A2A1C;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.gt{flex:1;min-width:0;overflow-wrap:anywhere}
.gt small{display:block;color:var(--tx3);font-size:12px}
.done .gt{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.gc{font:600 12.5px var(--fd);color:var(--amber);flex:none}
.done .gc{color:var(--tx3)}
.gx{width:44px;flex:none;color:var(--tx3);font-size:14px;display:grid;place-items:center;border-left:1px solid var(--line)}
.add{display:flex;gap:8px;margin-top:8px}
.add .in{flex:1;min-width:0}
.add .in.c{flex:0 0 72px;text-align:center;padding-left:6px;padding-right:6px}
.in{width:100%;padding:11px 14px;border-radius:13px;background:var(--bg3);border:1.5px solid transparent;outline:none;font-size:16px}
.in::placeholder{color:var(--tx3)}
.in:focus{border-color:rgba(255,193,94,.55)}
textarea.in{resize:vertical;line-height:1.4;min-height:120px}
select.in{-webkit-appearance:none;appearance:none}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pmi{background:var(--bg2);border-radius:15px;padding:11px 13px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;text-align:left}
.pmi span{color:var(--tx2);font-size:13px}
.pmi b{font:600 13px var(--fd)}
.pmi .bar{grid-column:1/-1;margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:15px;padding:4px;gap:4px}
.seg button{padding:9px 0;border-radius:11px;font-weight:600;color:var(--tx2);text-align:center;font-size:14px}
.seg button small{font-weight:500;color:var(--tx3);font-size:12px}
.seg button.on{background:var(--bg3);color:var(--tx)}
.plan{display:flex;gap:12px;align-items:center;margin-top:22px}
.plan b{display:block;font-weight:600}
.plan p{margin:2px 0 0;color:var(--tx2);font-size:13px}

/* --- звички --- */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px;background:var(--bg2);border-radius:16px;text-align:left;min-height:86px;transition:transform .12s}
.hb:active,.bd:active,.btn:active,.gm:active{transform:scale(.97)}
.hb .he{font-size:22px;line-height:1.1}
.hb .hn{font-weight:500;font-size:14px;line-height:1.25}
.hb .hc{font:600 12px var(--fd);color:var(--amber);margin-top:auto}
.hb.on{background:linear-gradient(160deg,rgba(63,224,160,.24),rgba(63,224,160,.07));box-shadow:inset 0 0 0 1.5px rgba(63,224,160,.5)}
.hb.on .hc{color:var(--mint)}
.hb.on::after{content:'';position:absolute;top:13px;right:13px;width:10px;height:5px;border:2.5px solid var(--mint);border-top:0;border-right:0;transform:rotate(-45deg)}
.bad{display:flex;flex-wrap:wrap;gap:8px}
.bd{padding:9px 12px;border-radius:13px;background:var(--bg2);font-size:14px;display:flex;gap:7px;align-items:center;transition:transform .12s}
.bd b{font:600 12px var(--fd);color:var(--red)}
.bd.on{background:rgba(255,84,112,.17);box-shadow:inset 0 0 0 1.5px rgba(255,84,112,.55)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:26px}
.stats>div{background:var(--bg2);border-radius:16px;padding:12px 10px}
.stats b{display:block;font:700 20px/1.2 var(--fd)}
.stats small{display:block;font-size:12px;color:var(--tx2);line-height:1.3;margin-top:3px}
.pr{margin:12px 0 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,127,110,.15),rgba(255,193,94,.05));font-size:14.5px;line-height:1.45}
.pr small{display:block;color:var(--coral);font-size:12px;font-weight:600;margin-bottom:3px}

/* --- кнопки, панелі --- */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px 16px;border-radius:14px;font-weight:600;background:var(--amber);color:#2B1700;transition:transform .12s,opacity .2s;text-align:center}
.btn.sm{width:auto;padding:9px 13px;border-radius:12px;font-size:14px;flex:none}
.btn.ghost{background:var(--bg3);color:var(--tx)}
.btn.red{background:var(--red);color:#fff}
.btn.dim{background:var(--bg3);color:var(--tx2)}
.btn+.btn{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.row2 .btn+.btn{margin-top:0}
.card{background:var(--bg2);border-radius:20px;padding:15px 16px}
.bar{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar.sm{height:5px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--coral),var(--amber))}

/* --- мрії --- */
.dream{position:relative;height:240px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,var(--s1),var(--s3) 55%,var(--s5));display:flex;flex-direction:column;justify-content:flex-end}
.dream.ph{background-color:var(--bg3);background-size:cover;background-position:center}
.dream::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,12,41,0) 30%,rgba(16,12,41,.92));z-index:1}
.dcity{position:absolute;left:0;right:0;bottom:0;height:130px}
.addph{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:2;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:500;white-space:nowrap}
.chph{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px}
.dc{position:relative;z-index:2;padding:16px}
.dn{font:600 18px/1.25 var(--fd)}
.dv{color:rgba(244,241,255,.85);font-size:14px;margin:3px 0 10px}
.dv b{font:600 16px var(--fd);color:var(--tx)}
.dr{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13.5px;color:var(--tx2)}
.cd{display:flex;gap:14px;align-items:center;margin-top:10px;text-align:left;width:100%}
.cdn{flex:none;width:84px;height:84px;border-radius:20px;background:linear-gradient(150deg,rgba(255,127,110,.28),rgba(255,193,94,.1));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.cdn b{font:700 22px/1.1 var(--fd)}
.cdn small{font-size:11px;color:var(--tx2);text-align:center;line-height:1.2;margin-top:3px}
.cd p{margin:0 0 4px}
.cd .mut{margin:0}
.jar{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;background:var(--bg2);border-radius:16px;margin-bottom:8px;text-align:left}
.je{font-size:23px;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.06);display:grid;place-items:center;flex:none}
.jm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.jm b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jm small{color:var(--tx2);font-size:12.5px}
.jp{font:600 13px var(--fd);color:var(--amber);flex:none}
.newjar{display:block;width:100%;padding:12px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.14);color:var(--tx2);text-align:center;font-size:14px}
.inc .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.inc .ih small{display:block;color:var(--tx2);font-size:13px;margin-top:3px}
.miles{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.miles span{font:600 12px var(--fd);padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--tx3)}
.miles span.on{background:rgba(63,224,160,.16);color:var(--mint)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.srcs span{font-size:12.5px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.06)}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:5px}
.col small{font-size:10.5px;color:var(--tx2);min-height:13px}
.col i{display:block;width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:rgba(255,193,94,.28)}
.col i.cur{background:linear-gradient(180deg,var(--amber),var(--coral))}
.col span{font-size:11px;color:var(--tx3)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.a{background:var(--bg2);border-radius:16px;padding:12px 7px 11px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.a span{font-size:26px;line-height:1.2}

  }

    if (f.st === 'build') {
      body += `<g class="scaf"><rect x="${X + .5}" y="${y + .5}" width="${W - 1}" height="${FH - 1}"/><path d="M${X + .5} ${y + FH - .5}L${X + W / 2} ${y + .5}L${X + W - .5} ${y + FH - .5}"/></g>`;

  // кран
  const mx = X + W + 14, mt = 14, jy = mt + 4, hx = X + 12, hy = Math.max(jy + 12, top - 10);
  let lat = '';
  for (let y = H; y > mt + 4; y -= 5) lat += `M${mx - 2.4} ${y}L${mx + 2.4} ${y - 2.5}L${mx - 2.4} ${y - 5}`;
  const crane = `<path class="cr" d="M${mx - 2.4} ${H}V${mt}M${mx + 2.4} ${H}V${mt}${lat}" stroke-width="1"/>
    <path class="cr" d="M${mx} ${mt - 8}V${jy}M${mx} ${mt - 8}L${mx - 76} ${jy}M${mx} ${mt - 8}L${mx + 26} ${jy}M${mx - 80} ${jy}H${mx + 30}M${mx - 80} ${jy + 2.6}H${mx + 30}"/>
    <rect class="crf" x="${mx - 4}" y="${jy + 2.6}" width="8" height="6" rx="1" opacity=".9"/>
    <rect class="crf" x="${mx + 19}" y="${jy + 2.6}" width="10" height="7" rx="1"/>
    <g class="trol"><rect class="crf" x="${hx - 3}" y="${jy + 2}" width="6" height="2.6"/><path class="cr" d="M${hx} ${jy + 4.6}V${hy}" stroke-width=".8"/><rect class="crf" x="${hx - 2}" y="${hy}" width="4" height="3"/>${topBuild ? `<path class="cr" d="M${hx} ${hy + 3}L${hx - 8} ${hy + 4.5}M${hx} ${hy + 3}L${hx + 8} ${hy + 4.5}" stroke-width=".7"/><rect class="tw-l" x="${hx - 9}" y="${hy + 4.5}" width="18" height="2.6" rx=".5"/>` : ''}</g>
    <circle class="beacon" cx="${mx}" cy="${mt - 9}" r="1.7"/>`;
  const svg = `<svg width="${VW}" height="${H}" viewBox="0 0 ${VW} ${H}" aria-hidden="true"><defs><filter id="tg${u}" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="1.8"/></filter></defs>${ghost}${body}${deco}<g filter="url(#tg${u})" opacity=".75">${glow}</g>${crane}</svg>`;

  const months = lastMonths(6), vals = months.map(incomeOf), mx = Math.max(1, ...vals);
  const bySrc = {};
  S.inc.filter(x => String(x.d).slice(0, 7) === m).forEach(x => { bySrc[x.s] = (bySrc[x.s] || 0) + x.a; });
  return `<h2>Дохід <small>${monthName(m)}</small></h2><div class="card inc">
    <div class="ih"><div><b class="big">${fmt(cur)} грн</b><small>${next ? `До ${fmt(next)}: ще ${fmt(next - cur)}` : 'Усі рубежі взято'}</small></div><button class="btn sm" data-a="incAdd">+ Дохід</button></div>
    <span class="bar"><i style="width:${next ? cur / next * 100 : 100}%"></i></span>
    <div class="miles">${ms.map(x => `<span class="${cur >= x ? 'on' : ''}">${cur >= x ? '✓ ' : ''}${fmt(x / 1000)} тис.</span>`).join('')}</div>
    ${Object.keys(bySrc).length ? `<div class="srcs">${Object.entries(bySrc).map(([s, a]) => `<span>${srcEmoji(s)} ${esc(s)}: ${fmt(a)}</span>`).join('')}</div>` : ''}
    <div class="chart">${months.map((mm, i) => `<div class="col"><small>${vals[i] ? fmtK(vals[i]) : ''}</small><i${mm === m ? ' class="cur"' : ''} style="height:${Math.max(3, Math.round(vals[i] / mx * 76))}px"></i><span>${MON_S[+mm.slice(5) - 1]}</span></div>`).join('')}</div>
  </div>`;
}

// act: знімок стану → дія → збереження → тост із «Скасувати»
function act(fn) {
  const snap = JSON.stringify(S);
  let msg;
  try { msg = fn(); } catch (e) { console.error(e); S = JSON.parse(snap); fxQ = []; toast('Щось пішло не так: ' + e.message); return false; }
  if (msg === false) { fxQ = []; return false; }
  const newAch = checkAch(), L = lvl(S.xp).L, up = L > (S.lvlSeen || 1);
  if (up) S.lvlSeen = L;
  save(); render();
  if (msg) toast(msg, () => { S = JSON.parse(snap); towerSig = ''; save(); render(); toast('Скасовано'); hap('light'); });
  const q = fxQ; fxQ = []; q.forEach(f => { try { f(); } catch (e) {} });
  if (up) setTimeout(() => { queueSheet(levelHTML(L)); burst(innerWidth / 2, innerHeight * .35, 90); hap('ok'); }, 650);
  newAch.forEach((a, i) => setTimeout(() => { queueSheet(achHTML(a)); burst(innerWidth / 2, innerHeight * .4, 60); }, 900 + i * 60));
  return true;
}

A.goal = (d, el) => {
  const g = findIn(S.goals, d.id); if (!g) return;
  const r = el.getBoundingClientRect();
  if (g.done) {
    act(() => {
      const got = g.got != null ? g.got : g.c, x = g.x != null ? g.x : g.c, dk = g.dk || (g.at ? dateKey(new Date(g.at)) : todayKey());
      unaward(got, x, dk, 'Скасовано: ' + g.t);
      g.done = false; delete g.got; delete g.x; delete g.dk;
      S.totalDone = Math.max(0, S.totalDone - 1);
      return 'Повернуто в невиконані';
    });
    return;
  }
  let got = 0;
  const ok = act(() => {
    g.done = true; g.at = Date.now(); g.dk = todayKey();
    got = award(g.c, g.t); g.got = got; g.x = g.c;
    S.totalDone++; mark();
    return got < g.c ? `Виконано. +${g.c} XP, монети: ліміт місяця` : `Виконано: +${got} 🪙`;
  });
  if (ok) fxGain(r, got, g.c);

async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    for (const [max, q] of [[720, .72], [720, .55], [560, .5], [420, .45]]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', q);
      if (url.length <= 140000) return url;
    }
    throw new Error('too big');
  } finally { URL.revokeObjectURL(src); }
}
async function onPhoto(e) {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  toast('Обробляю фото…');
  try {
    const url = await shrink(file);
    photo = url; render();
    const ok = await savePhoto(url);
    toast(ok ? 'Фото мрії збережено' : 'Фото показано, але не збережено');
  } catch (err) { console.warn(err); toast('Не вдалося обробити це фото'); }
}
